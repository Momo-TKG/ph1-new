<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンバー紹介</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 px-12">
    <header class="text-center py-6">
        <h1 class="text-2xl font-bold text-gray-700 ">メンバー紹介</h1>
    </header>
    <main>
        <ul class="flex flex-col md:flex-row gap-6">
            <li class="bg-white w-full p-4 rounded-lg shadow">
                <div class="flex flex-col items-center gap-2 mt-2">
                    <img src="./img/yamada.png" alt="山田太郎" class="w-32 h-32 rounded-full border-4 border-blue-50 object-cover shadow-sm">
                    <p class="text-sm font-bold text-blue-600 tracking-widest">リーダー</p>
                    <h2 class="text-2xl text-gray-800 font-bold tracking-wider">山田太郎</h2>
                </div>
                <div class="mt-4">
                    <p class="mt-2 text-gray-600 text-sm px-4">チームの羅針盤としてビジョンを策定し、的確なディレクションでプロジェクトを完遂へと導きます。</p>
                </div>
            </li>
            <li class="bg-white w-full p-4 rounded-lg shadow">
                <div class="flex flex-col items-center gap-2 mt-2">
                    <img src="./img/suzuki.png" alt="鈴木花子" class="w-32 h-32 rounded-full border-4 border-blue-50 object-cover shadow-sm">
                    <p class="text-sm font-bold text-blue-600 tracking-widest">デザイナー</p>
                    <h2 class="text-2xl text-gray-800 font-bold tracking-wider">鈴木花子</h2>
                </div>
                <div class="mt-4">
                    <p class="mt-2 text-gray-600 text-sm px-4">審美性と機能性を両立させたUI設計を行い、直感的な操作感を通じてユーザー体験を最大化させます。</p>
                </div>
            </li>
            <li class="bg-white w-full p-4 rounded-lg shadow">
                <div class="flex flex-col items-center gap-2 mt-2">
                    <img src="./img/tanaka.png" alt="田中一郎" class="w-32 h-32 rounded-full border-4 border-blue-50 object-cover shadow-sm">
                    <p class="text-sm font-bold text-blue-600 tracking-widest">開発者</p>
                    <h2 class="text-2xl text-gray-800 font-bold tracking-wider">田中一郎</h2>
                </div>
                <div class="mt-4">
                    <p class="mt-2 text-gray-600 text-sm px-4">常に最新の技術スタックを追求し、品質とスピードを両立させた開発でプロジェクトの根幹を支えます。</p>
                </div>
            </li>
        </ul>
    </main>
</body>
</html>

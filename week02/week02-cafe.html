<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 px-4">
    <header class="text-center">
        <h1 class="m-10 text-2xl font-bold text-amber-800">-Menu-</h1>
    </header>
    <h2 class="mt-8 mb-2 text-xl font-bold text-gray-800 ml-4">Drinks</h2>
        <ul class="flex gap-4">
            <li class="bg-white p-4 rounded-lg shadow w-full hover:shadow-lg">
                <h3>コーヒー(HOT/ICE)</h3>
                <p class="text-lg font-bold text-amber-600">￥350</p>
                <img src="./img/coffee.png" alt="コーヒー" class="rounded-lg my-2">
            </li>
            <li class="bg-white p-4 rounded-lg shadow w-full hover:shadow-lg">
                <h3>紅茶(HOT/ICE)</h3>
                <p class="text-lg font-bold text-amber-600">￥300</p>
                <img src="./img/tea.png" alt="紅茶" class="rounded-lg my-2">
            </li>
            <li class="bg-white p-4 rounded-lg shadow w-full hover:shadow-lg">
                <h3>オレンジジュース</h3>
                <p class="text-lg font-bold text-amber-600">￥300</p>
                <img src="./img/orange_juice.png" alt="オレンジジュース" class="rounded-lg my-2">
            </li>
        </ul>
    <h2 class="mt-8 mb-2 text-xl font-bold text-gray-800 ml-4">Foods</h2>
        <ul class="flex gap-4">
            <li class="bg-white p-4 rounded-lg shadow w-full hover:shadow-lg">
                <h3>サンドイッチ</h3>
                <p class="text-lg font-bold text-amber-600">￥500</p>
                <img src="./img/sandwich.png" alt="サンドイッチ" class="rounded-lg my-2">
            </li>
            <li class="bg-white p-4 rounded-lg shadow w-full hover:shadow-lg">
                <h3>プディング</h3>
                <p class="text-lg font-bold text-amber-600">￥400</p>
                <img src="./img/pudding.png" alt="プディング" class="rounded-lg my-2">
            </li>
            <li class="bg-white p-4 rounded-lg shadow w-full hover:shadow-lg">
                <h3>チーズケーキ</h3>
                <p class="text-lg font-bold text-amber-600">￥450</p>
                <img src="./img/cheese_cake.png" alt="チーズケーキ" class="rounded-lg my-2">
            </li>
        </ul>
</body>
</html>
